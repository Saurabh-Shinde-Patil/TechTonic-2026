<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#bc13fe" />
      <stop offset="100%" stop-color="#ff00ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100" height="100" fill="#0a0a0a" rx="20" />
  
  <g filter="url(#glow)">
    <!-- Circuit lines -->
    <path d="M 20 20 L 35 20 L 45 30 L 45 40" fill="none" stroke="rgba(0, 243, 255, 0.5)" stroke-width="2" />
    <circle cx="20" cy="20" r="3" fill="#00f3ff" />
    
    <path d="M 80 80 L 65 80 L 55 70 L 55 60" fill="none" stroke="rgba(255, 0, 255, 0.5)" stroke-width="2" />
    <circle cx="80" cy="80" r="3" fill="#ff00ff" />

    <!-- Stylized 'T' -->
    <path d="M 30 35 L 70 35 L 70 45 L 55 45 L 55 75 L 45 75 L 45 45 L 30 45 Z" fill="url(#neonGradient)" />
  </g>
</svg>